name: ssmask
channels:
  - conda-forge
dependencies:
  # Core interpreter (pin first for fast solving)
  - python=3.12

  # ABI-heavy scientific stack
  - numpy=1.26.4
  - scipy=1.16.3

  # Plotting / widgets / UI
  - matplotlib=3.10.8
  - ipympl=0.9.8
  - ipywidgets=8.1.8

  # Notebook environment
  - jupyterlab=4.5.0
  - tqdm=4.67.1
  - pandas=2.3.3

  - phidl=1.7.2
  - scikit-rf=1.10.0

  # pip installer
  - pip=25.3

  # Editable install (pip section always last)
  - pip:
      - -e .
